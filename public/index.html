<script>
if(!window.claude)window.claude={use:async n=>n=='room'?{join:async name=>{const cid=Math.random().toString(36).slice(2),H={},PL=[],post=(u,b)=>fetch(u+'?room='+name+'&cid='+cid,{method:'POST',body:JSON.stringify(b)}).catch(()=>{});
const es=new EventSource('/sse?room='+name+'&cid='+cid);es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type=='ev')(H[m.topic]||[]).forEach(f=>f({topic:m.topic,data:m.data,isMe:false}));else if(m.type=='left')PL.forEach(f=>f({left:[{presence:m.p||{}}],joined:[],peers:[]}))};
return{emit:(t,d)=>post('/emit',{topic:t,data:d}),on:(t,f)=>{(H[t]=H[t]||[]).push(f)},onPeers:f=>PL.push(f),presence:p=>post('/presence',p)}}}:null};
const $=s=>document.querySelector(s),CL=['R','Y','G','B'],CN={R:'#e53935',Y:'#f9c21b',G:'#2e9e4f',B:'#1e78d6',W:'#222'},SY={S:'⊘',R:'⇄',D:'+2',W:'★',F:'+4'},CNM={R:'Red',Y:'Yellow',G:'Green',B:'Blue'},BN=['Ava','Max','Zed','Luna','Kai','Mia','Rex','Nova','Leo'];
let me=Math.random().toString(36).slice(2,9),nm='',room=null,host=false,S=null,V=null,scr='home',mx=4,pick=null,lastJ='',seen=new Set(),lastDl=-1,code='',err='',bt,rn='Game Night';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360,av=n=>`<div class=av style="background:hsl(${hue(n)} 60% 45%)">${esc(n.trim()[0]||'?').toUpperCase()}</div>`;
const sh=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ok=(c,t,col,pd)=>pd?(c[1]=='F'||(c[1]=='D'&&t[1]=='D')):(c[0]=='W'||c[0]==col||c[1]==t[1]);
const nameOf=c=>c[0]=='W'?(c[1]=='F'?'Wild +4':'Wild'):CNM[c[0]]+' '+(SY[c[1]]||c[1]);
/* ---------- audio & fx ---------- */
let AC=null,mute=false,pv=null,ut=0;
function snd(seq){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();let t=AC.currentTime;for(const[f,d,ty,v]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8}}catch(e){}}
const SN={play:[[520,.06,'triangle'],[780,.09,'triangle']],draw:[[300,.07,'square',.06],[240,.08,'square',.06]],turn:[[660,.1],[880,.14]],uno:[[880,.1,'square',.1],[1100,.1,'square',.1],[880,.1,'square',.1],[1320,.2,'square',.1]],pen:[[200,.15,'sawtooth',.12],[140,.3,'sawtooth',.12]],win:[[523,.12],[659,.12],[784,.12],[1047,.4]],tick:[[900,.04,'sine',.08]],skip:[[400,.08,'sawtooth',.08],[300,.12,'sawtooth',.08]]};
const sfx=k=>snd(SN[k]);
const EM={'😂':[[700,.07],[900,.07],[700,.07],[950,.07],[1100,.12]],'😡':[[110,.25,'sawtooth',.14],[90,.32,'sawtooth',.14]],'👏':[[1500,.03,'square',.1],[1200,.03,'square',.08],[1500,.03,'square',.1],[1200,.03,'square',.08],[1500,.04,'square',.1]],'🔥':[[300,.1,'sawtooth',.08],[450,.1,'sawtooth',.08],[700,.1,'sawtooth',.08],[1000,.2,'sawtooth',.06]],'😭':[[600,.16],[520,.16],[430,.16],[330,.34]]};
const esfx=e=>snd(EM[e]||SN.tick);
function ban(t,c){const e=document.createElement('div');e.className='ban';e.textContent=t;e.style.setProperty('--bc',c||'#fff');$('#fx').append(e);setTimeout(()=>e.remove(),1300)}
function flo(t,n){const e=document.createElement('div');e.className='fl';e.style.left=(10+Math.random()*75)+'%';e.innerHTML=t+(n?`<div style="font-size:13px">${esc(n)}</div>`:'');$('#fx').append(e);setTimeout(()=>e.remove(),2300)}
function conf(){for(let i=0;i<90;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:${CN[CL[i%4]]};animation-delay:${Math.random()*.8}s;animation-duration:${2+Math.random()*2}s`;$('#fx').append(e);setTimeout(()=>e.remove(),5000)}}
function react(e){room&&room.emit('em',{n:nm,e});flo(e,nm);esfx(e)}
function fxdiff(v){const o=pv;pv=v;if(!o||v.ph=='lobby'||o.ph=='lobby')return;const mi=v.pl.findIndex(p=>p.id==me),pen=v.log!=o.log&&(v.log.includes('forgot')||v.log.includes('caught'));
if(v.dl>o.dl){sfx('play');const c=v.top[1],cc=CN[v.col];if(c=='S'){ban('SKIP',cc);sfx('skip')}else if(c=='R')ban('REVERSE',cc);else if(c=='D')ban('+2',cc);else if(c=='F')ban('+4',cc);else if(c=='W')ban(CNM[v.col].toUpperCase(),cc)}
else if(v.pl.some((p,i)=>o.pl[i]&&p.h.length>o.pl[i].h.length))sfx(pen?'pen':'draw');
if(pen)ban('+2 PENALTY','#e53935');
if(v.ud&&!(o.ud&&o.ud.id==v.ud.id)){ut=Date.now();if(v.ud.id==me){sfx('uno');ban('PRESS UNO!','#e53935')}else ban(((v.pl.find(p=>p.id==v.ud.id)||{}).n||'')+' has one card!','#f9c21b')}
if(v.ph=='over'&&o.ph!='over'){sfx('win');conf()}
if(v.ph=='play'&&v.cur==mi&&(o.cur!=v.cur||o.ph!='play'))sfx('turn')}
document.addEventListener('pointerdown',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}},{once:true});
/* ---------- host engine ---------- */
function mk(){const d=[];for(const c of CL){d.push(c+'0');for(let i=0;i<2;i++)for(const v of '123456789SRD')d.push(c+v)}for(let i=0;i<4;i++)d.push('WW','WF');return sh(d)}
const pub=()=>{const{deck,disc,...r}=S;r.dc=deck.length;r.dl=disc.length;return r};
const nx=(i,k=1)=>{const n=S.pl.length;return((i+S.dir*k)%n+n)%n};
function dr(n){const o=[];while(n--){if(!S.deck.length){const t=S.disc.pop();S.deck=sh(S.disc);S.disc=[t];if(!S.deck.length)break}o.push(S.deck.pop())}return o}
function bc(){V=pub();room&&room.emit('st',V);fxdiff(V);if(scr=='game')render();sched()}
function begin(){S.deck=mk();S.pl.forEach(p=>{p.h=dr(7);p.u=0});let c;do{c=S.deck.pop()}while(c[1]=='F');
S.disc=[c];S.top=c;S.col=c[0]=='W'?CL[Math.random()*4|0]:c[0];S.dir=1;S.pend=0;S.dr=null;S.ud=null;S.win=null;S.ph='play';S.log='Game on!';S.cur=0;const n=S.pl.length;
if(c[1]=='S')S.cur=1%n;else if(c[1]=='R'){S.dir=-1;S.cur=n-1}else if(c[1]=='D')S.pend=2}
function act(id,t,c,k){
if(!host||!S)return;const i=S.pl.findIndex(p=>p.id==id),p=S.pl[i];
if(t=='join'){if(!p&&S.ph=='lobby'&&S.pl.length<S.mx){S.pl.push({id,n:String(c||'Player').slice(0,14),b:0,h:[],u:0});bc()}return}
if(id==me){
if(t=='bot'&&S.ph=='lobby'&&S.pl.length<S.mx){const u=S.pl.map(q=>q.n);S.pl.push({id:'b'+Math.random().toString(36).slice(2,7),n:(BN.find(x=>!u.includes(x+' 🤖'))||'Bot')+' 🤖',b:1,h:[],u:0});return bc()}
if(t=='unbot'&&S.ph=='lobby'){S.pl=S.pl.filter(q=>q.id!=c);return bc()}
if(t=='start'&&S.ph=='lobby'&&S.pl.length>1){begin();return bc()}
if(t=='again'&&S.ph=='over'){S.ph='lobby';S.ud=null;return bc()}}
if(S.ph!='play'||!p)return;
if(t=='uno'){if(S.ud){if(S.ud.id==id){S.ud=null;S.log=p.n+' says UNO!'}else{const v=S.pl.find(q=>q.id==S.ud.id);S.ud=null;S.log=p.n+' caught '+v.n+'! +2 cards';give(v,2)}}else if(p.h.length<=2)p.u=1;return bc()}
if(S.lock||i!=S.cur)return;
if(t=='play'){if(!p.h.includes(c)||(S.dr&&c!=S.dr)||!ok(c,S.top,S.col,S.pend))return;
p.h.splice(p.h.indexOf(c),1);S.disc.push(c);S.top=c;S.col=c[0]=='W'?(k||'R'):c[0];S.dr=null;S.log=p.n+' played '+nameOf(c);
if(!p.h.length){S.ph='over';S.win=p.n;p.w=(p.w||0)+1;S.ud=null;return bc()}
if(p.h.length==1){if(p.u)p.u=0;else{const u=S.ud={id:p.id};setTimeout(()=>{if(S.ud==u){S.ud=null;S.log=p.n+' forgot to say UNO! +2 cards';give(p,2)}},3500);
if(p.b)setTimeout(()=>Math.random()>.12&&act(p.id,'uno'),500+Math.random()*1800)}}
const v=c[1];if(v=='R'){S.dir*=-1;if(S.pl.length>2)S.cur=nx(S.cur)}else if(v=='S')S.cur=nx(S.cur,2);else{if(v=='D')S.pend+=2;if(v=='F')S.pend+=4;S.cur=nx(S.cur)}
return bc()}
if(t=='draw'&&!S.dr){p.u=0;const pe=S.pend,n=pe||1;S.log=p.n+(n>1?' must draw '+n+' cards':' draws a card');
give(p,n,()=>{S.pend=0;const d=p.h[p.h.length-1];if(!pe&&d&&ok(d,S.top,S.col,0)){S.dr=d;S.log=p.n+' can play the drawn card'}else S.cur=nx(S.cur);bc()});return}
if(t=='pass'&&S.dr){S.dr=null;S.cur=nx(S.cur);bc()}}
let opc={};
function give(p,n,cb){S.lock=1;const step=k=>{if(k>0){const c=dr(1);if(c.length)p.h.push(c[0]);bc();setTimeout(()=>step(k-1),560)}else{S.lock=0;cb&&cb()}};step(n)}
function sched(){clearTimeout(bt);if(!S||S.ph!='play')return;const p=S.pl[S.cur];if(!p.b)return;
bt=setTimeout(()=>{const pl=(S.dr?[S.dr]:p.h).filter(c=>ok(c,S.top,S.col,S.pend)).sort((a,b)=>(b[0]!='W')-(a[0]!='W')||Math.random()-.5);
if(pl.length){const n={R:0,Y:0,G:0,B:0};p.h.forEach(x=>n[x[0]]!==undefined&&n[x[0]]++);act(p.id,'play',pl[0],[...CL].sort((a,b)=>n[b]-n[a])[0])}else act(p.id,S.dr?'pass':'draw')},1700+Math.random()*1300)}
/* ---------- networking ---------- */
const send=(t,c,k)=>host?act(me,t,c,k):room&&room.emit('ac',{i:me,t,c,k});
async function connect(){
const r=window.claude&&await window.claude.use('room');
if(!r){err='Multiplayer is not available in this view. Open the shared artifact link while signed in to claude.ai.';return render()}
room=await r.join('uno-'+code.toLowerCase());
room.on('st',m=>{if(host)return;const s=JSON.stringify(m.data);if(s==lastJ)return;lastJ=s;V=m.data;fxdiff(V);if(scr=='game')render()});
room.on('em',m=>{const d=m.data;if(d&&!m.isMe){flo(String(d.e).slice(0,4),String(d.n).slice(0,14));esfx(String(d.e).slice(0,4))}});
room.on('ac',m=>{const d=m.data;if(host&&d)act(d.i,d.t,d.c,d.k)});
room.onPeers(ch=>{if(!host||!S)return;ch.left.forEach(q=>{const id=q.presence&&q.presence.id,i=S.pl.findIndex(p=>p.id==id);if(i<1)return;if(S.ph=='lobby')S.pl.splice(i,1);else{S.pl[i].b=1;S.pl[i].n+=' 🤖'}bc()})});
room.presence({id:me});
if(host){bc();setInterval(()=>room.emit('st',V),2500)}
else setInterval(()=>{if(!V||!V.pl.some(p=>p.id==me))send('join',nm)},1500)}
/* ---------- screens ---------- */
const go=s=>{scr=s;render()};
function ent(){nm=($('#nm').value||'').trim().slice(0,14)||'Player';
if(host){code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');try{location.hash=code}catch(e){}
S={deck:[],disc:[],ph:'lobby',mx,pl:[{id:me,n:nm,b:0,h:[],u:0}],top:'',col:'R',cur:0,dir:1,pend:0,dr:null,ud:null,log:'',win:null,rc:code,rn:(rn.trim()||'Game Night').slice(0,24)};V=pub()}
scr='game';render();connect()}
function jc(){const c=$('#cd').value.toUpperCase().trim();if(/^[A-Z]{4}$/.test(c)){code=c;host=false;go('name')}}
const home=()=>`<div class=ctr><div class=logo>UNO</div><p class=mut>Play with your friends. Up to 10 players, computer players welcome.</p><button class="btn pri" onclick="go('cfg')">Create room</button><div class=row><input id=cd maxlength=4 placeholder="ROOM CODE" style="width:150px;text-transform:uppercase"><button class=btn onclick=jc()>Join</button></div></div>`;
const cfg=()=>`<div class=ctr><h2>Room setup</h2><input maxlength=24 placeholder="Room name" value="${esc(rn)}" oninput="rn=this.value" style="width:min(320px,86vw)"><p class=mut>How many players? Seats include computer players you add later.</p><div class=row style="max-width:340px">${[2,3,4,5,6,7,8,9,10].map(i=>`<button class="chip ${i==mx?'on':''}" onclick="mx=${i};render()">${i}</button>`).join('')}</div><div class=row><button class=btn onclick="go('home')">Back</button><button class="btn pri" onclick="host=true;go('name')">Continue</button></div></div>`;
const nameS=()=>`<div class=ctr><h2>${host?'Create your room':'Joining room '+code}</h2><input id=nm maxlength=14 placeholder="Your name" value="${esc(nm)}" onkeydown="event.key=='Enter'&&ent()"><button class="btn pri" onclick=ent()>Enter room</button></div>`;
const cd=(c,x='',oc='')=>{const s=SY[c[1]]||c[1];return`<div class="cd ${c[0]=='W'?'w':''} ${s.length>1?'l2':''} ${x}" style="--c:${CN[c[0]]}" ${oc?`onclick="${oc}"`:''}><u>${s}</u><i>${s}</i><u class=b>${s}</u></div>`};
function copy(){const u=location.href.split('#')[0]+'#'+code;try{navigator.clipboard.writeText(u);$('#cp').textContent='Copied!'}catch(e){prompt('Copy this link',u)}}
function lobby(v,mi){const h=mi==0;
return`<div class=ctr style="width:100%"><h2>${esc(v.rn)}</h2><div style="color:#f9c21b;letter-spacing:6px;font-weight:800">CODE ${esc(v.rc)}</div><button class=btn id=cp onclick=copy()>Copy invite link</button><p class=mut style="font-size:13px">Friends can also open the page and enter code ${esc(v.rc)}</p>
<div class=card2><b>Players ${v.pl.length}/${v.mx}</b>${v.pl.map((p,i)=>`<div class=pl>${av(p.n)}<span style="flex:1">${esc(p.n)}${i==0?' 👑':''}${p.id==me?' (you)':''}${p.w?' · 🏆'+p.w:''}</span>${h&&p.b?`<button class=btn style="padding:3px 10px" onclick="send('unbot','${p.id}')">✕</button>`:''}</div>`).join('')}</div>
${h?`<div class=row><button class=btn ${v.pl.length>=v.mx?'disabled':''} onclick="send('bot')">+ Add computer</button><button class="btn pri" ${v.pl.length<2?'disabled':''} onclick="send('start')">Start game</button></div>`:'<p class=mut>Waiting for the host to start…</p>'}</div>`}
function table(v,mi){const me_=v.pl[mi],my=v.cur==mi&&v.ph=='play',n=v.pl.length;
const ord=[];for(let k=1;k<n;k++)ord.push(v.pl[(mi+k)%n]);
const ops=ord.map(p=>{const cur=v.pl[v.cur]==p&&v.ph=='play',m=Math.min(p.h.length,14),q=opc[p.id]||0;opc[p.id]=p.h.length;const st=Math.min(7,70/Math.max(m,1));
const f=Array.from({length:m},(_,k)=>{const o=k-(m-1)/2;return`<div class="cd bk ${k>=q?'new':''}" style="--r:${(-o*st).toFixed(1)}deg"><i></i></div>`}).join('');
return`<div class="op ${cur?'cur':''}">${cur?'<div class=tag>▼ '+(p.b?'THINKING…':'PLAYING')+' ▼</div>':''}<div class=fan>${f}</div><div class=lb><span>${esc(p.n)}</span><span>${p.h.length} cards · ${p.w||0} ★</span></div></div>`}).join('');
const rank=c=>CL.indexOf(c[0])*20+('0123456789SRDWF'.indexOf(c[1])),hand=[...me_.h].sort((a,b)=>rank(a)-rank(b)),cnt={},keys=[];
const hh=hand.map(c=>{cnt[c]=(cnt[c]||0)+1;const k=c+cnt[c];keys.push(k);const pl=my&&(!v.dr||c==v.dr)&&ok(c,v.top,v.col,v.pend);return cd(c,(my?pl?'ok ':'no ':'')+(seen.has(k)?'':'new'),pl?`play('${c}')`:'')}).join('');
seen=new Set(keys);const dz=v.dl!=lastDl?(v.log.startsWith(me_.n+' played')?'drop':'dropo'):'';lastDl=v.dl;
const unoBtn=!!v.ud&&v.ud.id==me_.id,catchP=v.ud&&v.ud.id!=me_.id?v.pl.find(p=>p.id==v.ud.id):null;
return`<div class=top><button class=quit onclick="location.hash='';location.reload()">⮌ QUIT</button><b>${esc(v.rn)} · ${esc(v.rc)}</b><button class=sq onclick="mute=!mute;render()">${mute?'🔇':'🔊'}</button></div><div class=ops>${ops}</div>
<div class=mid><div class=cen><div class=side><div class=dia style="background:${v.pend?'#e53935':'#2a62c9'}"><b>${v.pend?'+'+v.pend:v.dc}</b></div></div>
<div class=frame><div class="pile big ${my&&!v.dr?'on':''}" onclick="my_()"><div class="cd bk"><i>UNO</i></div></div><div class=big style="--cc:${CN[v.col]}">${cd(v.top,'disc '+dz)}</div></div>
<div class=side><div class=dia style="background:${CN[v.col]}"></div><div class=dia style="background:#5b3fd1"><b>${v.dir>0?'›':'‹'}</b></div></div></div>
${v.ph=='play'?`<div class="tp ${my?'me':''}">${my?(v.dr?'⭐ Your turn · play it or pass':'⭐ Your turn!'):'▶ '+esc(v.pl[v.cur].n)+'’s turn'}</div>`:''}
${v.ud?`<div class=bar><i style="--d:-${((Date.now()-ut)/1000).toFixed(2)}s"></i></div>`:''}<div class=log>${esc(v.log)}</div></div>
<div class=lab><span>${esc(me_.n)}</span><span>${me_.w||0} ★</span></div>
<div class="hand ${hand.length>12?'dense':''}">${hh}</div>
<div class=em>${['😂','😡','👏','🔥','😭'].map(e=>`<button onclick="react('${e}')">${e}</button>`).join('')}</div><div class=acts>${unoBtn&&v.ph=='play'?`<button class=uno onclick="send('uno')">UNO!</button>`:''}${catchP&&v.ph=='play'?`<button class=btn style="border-color:#ffd54a" onclick="send('uno')">👀 Catch ${esc(catchP.n)}</button>`:''}${my&&v.dr?`<button class=btn onclick="send('pass')">Pass</button>`:''}</div>
${pick?`<div class=ov><div class=card2 style="align-items:center"><b>Pick a color</b><div class=row style="max-width:240px">${CL.map(c=>`<div class=col style="background:${CN[c]}" onclick="pc('${c}')"></div>`).join('')}</div><button class=btn onclick="pick=null;render()">Cancel</button></div></div>`:''}
${v.ph=='over'?`<div class=ov><div class=card2 style="align-items:center;text-align:center"><div style="font-size:60px">🏆</div><h2>${esc(v.win)} wins!</h2><div class=mut>${v.pl.map(p=>esc(p.n)+' 🏆'+(p.w||0)).join(' · ')}</div>${mi==0?`<button class="btn pri" onclick="send('again')">Back to lobby</button>`:'<p class=mut>Waiting for host…</p>'}</div></div>`:''}`}
function game(){if(err)return`<div class=ctr><h2>Can’t connect</h2><p class=mut>${esc(err)}</p></div>`;
if(!V)return`<div class=ctr><h2>Connecting…</h2></div>`;const mi=V.pl.findIndex(p=>p.id==me);
if(mi<0)return`<div class=ctr><h2>${V.ph!='lobby'?'Game already in progress':V.pl.length>=V.mx?'Room is full':'Joining…'}</h2></div>`;
if(V.ph=='lobby'){seen=new Set();opc={};lastDl=-1;return lobby(V,mi)}return table(V,mi)}
function play(c){if(!V||V.ph!='play'||V.pl[V.cur].id!=me||!ok(c,V.top,V.col,V.pend))return;if(c[0]=='W'){pick=c;render()}else send('play',c)}
function pc(k){const c=pick;pick=null;send('play',c,k)}
function my_(){if(V&&V.ph=='play'&&V.pl[V.cur].id==me&&!V.dr)send('draw')}
function render(){$('#app').innerHTML=scr=='home'?home():scr=='cfg'?cfg():scr=='name'?nameS():game();document.body.classList.toggle('myturn',scr=='game'&&!!V&&V.ph=='play'&&!!V.pl[V.cur]&&V.pl[V.cur].id==me)}
const h0=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z]{4}$/.test(h0)){code=h0;scr='name'}
render();
</script></body></html>
